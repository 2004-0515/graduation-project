name: Frontend Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: frontend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test:run

  playwright:
    name: Playwright E2E (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: vitest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, public, user, orders, admin]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p123456 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: shopping_mall_test
      DB_USERNAME: root
      DB_PASSWORD: 123456
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Prepare CI SQL files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          def normalize_database(content: str) -> str:
              content = content.replace(
                  "CREATE DATABASE IF NOT EXISTS shopping_mall",
                  "CREATE DATABASE IF NOT EXISTS shopping_mall_test",
              )
              return content.replace("USE shopping_mall;", "USE shopping_mall_test;")

          schema_source = normalize_database(
              Path("backend/src/main/resources/schema.sql").read_text(encoding="utf-8")
          )

          # Keep CI schema import DDL-only so step failures map to actual schema problems.
          schema_ci = re.sub(
              r"\n-- 插入示例优惠券数据.*?;\n",
              "\n",
              schema_source,
              count=1,
              flags=re.S,
          )
          schema_ci = re.sub(
              r"\n-- 插入示例音乐数据.*?;\n",
              "\n",
              schema_ci,
              count=1,
              flags=re.S,
          )

          Path("backend/src/main/resources/schema-ci.sql").write_text(
              schema_ci,
              encoding="utf-8",
          )
          PY

      - name: Create test database
        shell: bash
        run: |
          set -euo pipefail
          mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -p123456 -e "DROP DATABASE IF EXISTS shopping_mall_test; CREATE DATABASE shopping_mall_test DEFAULT CHARACTER SET utf8mb4 DEFAULT COLLATE utf8mb4_unicode_ci;"

      - name: Import schema.sql into test database
        shell: bash
        run: |
          set -euo pipefail
          mysql --version
          if ! mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -p123456 < backend/src/main/resources/schema-ci.sql 2>schema-import.stderr; then
            echo "Schema import failed. MySQL stderr:"
            cat schema-import.stderr
            echo "First 80 lines of schema-ci.sql:"
            nl -ba backend/src/main/resources/schema-ci.sql | sed -n '1,80p'
            exit 1
          fi

      - name: Run Playwright suite through browser stack wrapper
        shell: pwsh
        run: |
          $wrapperLog = Join-Path $PWD 'wrapper-browser.log'
          Remove-Item $wrapperLog -ErrorAction SilentlyContinue

          & pwsh -NoProfile -File ./scripts/run-real-browser-e2e.ps1 -Suite ${{ matrix.suite }} *> $wrapperLog
          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
            $tailLines = if (Test-Path $wrapperLog) {
              @(Get-Content $wrapperLog | Select-Object -Last 25)
            } else {
              @('wrapper-browser.log was not created.')
            }
            $summary = ($tailLines -join ' | ').Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error::run-real-browser-e2e.ps1 failed with exit code $exitCode. Tail: $summary"
            if (Test-Path $wrapperLog) {
              Get-Content $wrapperLog -Tail 80
            }
            exit $exitCode
          }

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.suite }}
          path: |
            frontend/playwright-report
            frontend/test-results
            backend/spring-browser.log
            backend/spring-browser.err.log
            frontend/vite-browser.log
            frontend/vite-browser.err.log
            wrapper-browser.log

