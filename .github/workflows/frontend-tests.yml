name: Frontend Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: frontend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test:run

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: vitest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p123456 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: shopping_mall_demo
      DB_USERNAME: root
      DB_PASSWORD: 123456
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5178
      VITE_PROXY_TARGET: http://127.0.0.1:8085
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Prepare CI demo SQL files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          def normalize_database(content: str) -> str:
              content = content.replace(
                  "CREATE DATABASE IF NOT EXISTS shopping_mall",
                  "CREATE DATABASE IF NOT EXISTS shopping_mall_demo",
              )
              return content.replace("USE shopping_mall;", "USE shopping_mall_demo;")

          schema_source = normalize_database(
              Path("backend/src/main/resources/schema.sql").read_text(encoding="utf-8")
          )
          data_source = normalize_database(
              Path("backend/src/main/resources/data.sql").read_text(encoding="utf-8")
          )

          # Keep CI schema import DDL-only so step failures map to actual schema problems.
          schema_ci = re.sub(
              r"\n-- 插入示例优惠券数据.*?;\n",
              "\n",
              schema_source,
              count=1,
              flags=re.S,
          )
          schema_ci = re.sub(
              r"\n-- 插入示例音乐数据.*?;\n",
              "\n",
              schema_ci,
              count=1,
              flags=re.S,
          )

          Path("backend/src/main/resources/schema-ci.sql").write_text(
              schema_ci,
              encoding="utf-8",
          )
          Path("backend/src/main/resources/data-ci.sql").write_text(
              data_source,
              encoding="utf-8",
          )

          # Split data.sql into individual INSERT statements for easier CI diagnostics.
          insert_statements = re.findall(
              r"(^INSERT INTO .*?;)\s*$",
              data_source,
              flags=re.M | re.S,
          )
          data_step_dir = Path("backend/src/main/resources/data-ci-steps")
          data_step_dir.mkdir(exist_ok=True)
          for old_file in data_step_dir.glob("*.sql"):
              old_file.unlink()
          for step_index, chunk in enumerate(insert_statements, start=1):
              first_line = chunk.splitlines()[0]
              table_name = first_line.split()[2]
              target = data_step_dir / f"{step_index:02d}-{table_name}.sql"
              target.write_text(chunk + "\n", encoding="utf-8")
          PY

      - name: Create demo database
        shell: bash
        run: |
          set -euo pipefail
          mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -p123456 -e "DROP DATABASE IF EXISTS shopping_mall_demo; CREATE DATABASE shopping_mall_demo DEFAULT CHARACTER SET utf8mb4 DEFAULT COLLATE utf8mb4_unicode_ci;"

      - name: Import schema.sql into demo database
        shell: bash
        run: |
          set -euo pipefail
          mysql --version
          if ! mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -p123456 < backend/src/main/resources/schema-ci.sql 2>schema-import.stderr; then
            echo "Schema import failed. MySQL stderr:"
            cat schema-import.stderr
            echo "First 80 lines of schema-ci.sql:"
            nl -ba backend/src/main/resources/schema-ci.sql | sed -n '1,80p'
            exit 1
          fi

      - name: Import 01-tb_user.sql
        shell: bash
        run: |
          set -euo pipefail
          mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -p123456 shopping_mall_demo < backend/src/main/resources/data-ci-steps/01-tb_user.sql

      - name: Inspect imported tb_user ids
        shell: bash
        run: |
          set -euo pipefail
          user_snapshot="$(
            mysql --default-character-set=utf8mb4 -N -h 127.0.0.1 -uroot -p123456 shopping_mall_demo \
              -e "SELECT GROUP_CONCAT(CONCAT(id, ':', username) ORDER BY id SEPARATOR ', ') FROM tb_user"
          )"
          wangwu_id="$(
            mysql --default-character-set=utf8mb4 -N -h 127.0.0.1 -uroot -p123456 shopping_mall_demo \
              -e "SELECT COALESCE(CAST(id AS CHAR), 'missing') FROM tb_user WHERE username = 'wangwu'"
          )"
          echo "::notice title=tb_user ids::${user_snapshot}"
          echo "::notice title=wangwu id::${wangwu_id}"

      - name: Import 02-tb_category.sql
        shell: bash
        run: |
          set -euo pipefail
          mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -p123456 shopping_mall_demo < backend/src/main/resources/data-ci-steps/02-tb_category.sql

      - name: Import 03-tb_product.sql
        shell: bash
        run: |
          set -euo pipefail
          mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -p123456 shopping_mall_demo < backend/src/main/resources/data-ci-steps/03-tb_product.sql

      - name: Import 04-addresses.sql
        shell: bash
        run: |
          set -euo pipefail
          mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -p123456 shopping_mall_demo < backend/src/main/resources/data-ci-steps/04-addresses.sql

      - name: Import 05-security_settings.sql
        shell: bash
        run: |
          set -euo pipefail
          mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -p123456 shopping_mall_demo < backend/src/main/resources/data-ci-steps/05-security_settings.sql

      - name: Import 06-privacy_settings.sql
        shell: bash
        run: |
          set -euo pipefail
          mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -p123456 shopping_mall_demo < backend/src/main/resources/data-ci-steps/06-privacy_settings.sql

      - name: Import 07-notification_settings.sql
        shell: bash
        run: |
          set -euo pipefail
          mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -p123456 shopping_mall_demo < backend/src/main/resources/data-ci-steps/07-notification_settings.sql

      - name: Import 08-tb_coupon.sql
        shell: bash
        run: |
          set -euo pipefail
          mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -p123456 shopping_mall_demo < backend/src/main/resources/data-ci-steps/08-tb_coupon.sql

      - name: Import 09-tb_price_history.sql
        shell: bash
        run: |
          set -euo pipefail
          mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -p123456 shopping_mall_demo < backend/src/main/resources/data-ci-steps/09-tb_price_history.sql

      - name: Import 10-tb_price_alert.sql
        shell: bash
        run: |
          set -euo pipefail
          if ! mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -p123456 shopping_mall_demo < backend/src/main/resources/data-ci-steps/10-tb_price_alert.sql 2>mysql-import-10.stderr; then
            echo "::error title=Import 10-tb_price_alert.sql::$(tr '\r\n' '  ' < mysql-import-10.stderr)"
            cat mysql-import-10.stderr
            exit 1
          fi

      - name: Import 11-tb_price_alert.sql
        shell: bash
        run: |
          set -euo pipefail
          if ! mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -p123456 shopping_mall_demo < backend/src/main/resources/data-ci-steps/11-tb_price_alert.sql 2>mysql-import-11.stderr; then
            echo "::error title=Import 11-tb_price_alert.sql::$(tr '\r\n' '  ' < mysql-import-11.stderr)"
            cat mysql-import-11.stderr
            exit 1
          fi

      - name: Import 12-tb_price_alert.sql
        shell: bash
        run: |
          set -euo pipefail
          if ! mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -p123456 shopping_mall_demo < backend/src/main/resources/data-ci-steps/12-tb_price_alert.sql 2>mysql-import-12.stderr; then
            echo "::error title=Import 12-tb_price_alert.sql::$(tr '\r\n' '  ' < mysql-import-12.stderr)"
            cat mysql-import-12.stderr
            exit 1
          fi

      - name: Import 13-tb_price_alert.sql
        shell: bash
        run: |
          set -euo pipefail
          if ! mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -p123456 shopping_mall_demo < backend/src/main/resources/data-ci-steps/13-tb_price_alert.sql 2>mysql-import-13.stderr; then
            echo "::error title=Import 13-tb_price_alert.sql::$(tr '\r\n' '  ' < mysql-import-13.stderr)"
            cat mysql-import-13.stderr
            exit 1
          fi

      - name: Import 14-tb_price_alert.sql
        shell: bash
        run: |
          set -euo pipefail
          if ! mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -p123456 shopping_mall_demo < backend/src/main/resources/data-ci-steps/14-tb_price_alert.sql 2>mysql-import-14.stderr; then
            echo "::error title=Import 14-tb_price_alert.sql::$(tr '\r\n' '  ' < mysql-import-14.stderr)"
            cat mysql-import-14.stderr
            exit 1
          fi

      - name: Import 15-tb_price_alert.sql
        shell: bash
        run: |
          set -euo pipefail
          if ! mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -p123456 shopping_mall_demo < backend/src/main/resources/data-ci-steps/15-tb_price_alert.sql 2>mysql-import-15.stderr; then
            echo "::error title=Import 15-tb_price_alert.sql::$(tr '\r\n' '  ' < mysql-import-15.stderr)"
            cat mysql-import-15.stderr
            exit 1
          fi

      - name: Import 16-tb_price_alert.sql
        shell: bash
        run: |
          set -euo pipefail
          if ! mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -p123456 shopping_mall_demo < backend/src/main/resources/data-ci-steps/16-tb_price_alert.sql 2>mysql-import-16.stderr; then
            echo "::error title=Import 16-tb_price_alert.sql::$(tr '\r\n' '  ' < mysql-import-16.stderr)"
            cat mysql-import-16.stderr
            exit 1
          fi

      - name: Import 17-tb_price_alert.sql
        shell: bash
        run: |
          set -euo pipefail
          if ! mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -p123456 shopping_mall_demo < backend/src/main/resources/data-ci-steps/17-tb_price_alert.sql 2>mysql-import-17.stderr; then
            echo "::error title=Import 17-tb_price_alert.sql::$(tr '\r\n' '  ' < mysql-import-17.stderr)"
            cat mysql-import-17.stderr
            exit 1
          fi

      - name: Import demo enhancement SQL
        shell: bash
        run: |
          set -euo pipefail
          mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -p123456 shopping_mall_demo < scripts/demo-data-enhancement.sql

      - name: Start backend
        working-directory: backend
        shell: bash
        run: |
          nohup mvn spring-boot:run \
            -Dspring-boot.run.profiles=demo,browser \
            -Dspring-boot.run.arguments=--server.port=8085 \
            > spring-ci.log 2> spring-ci.err.log &

      - name: Wait for backend
        shell: bash
        run: |
          for i in {1..120}; do
            if curl -fsS "http://127.0.0.1:8085/api/products?pageNo=0&pageSize=1" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready"
          exit 1

      - name: Start frontend
        working-directory: frontend
        shell: bash
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5178 > vite-ci.log 2> vite-ci.err.log &

      - name: Wait for frontend
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:5178" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become ready"
          exit 1

      - name: Run full Playwright suite
        working-directory: frontend
        run: npx playwright test tests/e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            backend/spring-ci.log
            backend/spring-ci.err.log
            frontend/vite-ci.log
            frontend/vite-ci.err.log
