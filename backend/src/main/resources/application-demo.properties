# Dedicated demo profile: isolated database/cache defaults and broader same-machine
# frontend origins for nearby manual ports used during demo rehearsal.
server.port=8085

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shopping_mall_demo}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.data.redis.database=${REDIS_DB:1}

app.dev.frontend-origins=http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174,http://127.0.0.1:5175,http://localhost:5175,http://127.0.0.1:5178,http://localhost:5178
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.dev.frontend-origins}}

resilience4j.ratelimiter.instances.api-rate-limiter.limit-for-period=100000
resilience4j.ratelimiter.instances.api-rate-limiter.limit-refresh-period=60s
resilience4j.ratelimiter.instances.api-rate-limiter.timeout-duration=100ms
resilience4j.ratelimiter.instances.login-rate-limiter.limit-for-period=1000
resilience4j.ratelimiter.instances.login-rate-limiter.limit-refresh-period=60s
resilience4j.ratelimiter.instances.login-rate-limiter.timeout-duration=100ms
