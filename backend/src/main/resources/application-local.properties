# Optional fallback profile for temporary local debugging only.
# Do not use this profile for normal web development when real MySQL data is required.
server.port=8080
server.servlet.context-path=/api

spring.datasource.url=jdbc:h2:mem:shoppingmall_local;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:schema-local.sql
spring.sql.init.data-locations=classpath:data-local.sql

spring.data.redis.repositories.enabled=false
spring.cache.type=simple

jwt.secret=shopping-mall-local-development-secret-key
jwt.expiration=86400000
jwt.header=Authorization
jwt.refresh-expiration=604800000

file.upload-dir=../uploads

# Local fallback profile keeps the same-machine frontend origin list only for temporary debugging.
app.dev.frontend-origins=http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174,http://127.0.0.1:5175,http://localhost:5175,http://127.0.0.1:5178,http://localhost:5178,http://localhost:3000
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.dev.frontend-origins}}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

logging.level.root=INFO
logging.level.com.shopping=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
