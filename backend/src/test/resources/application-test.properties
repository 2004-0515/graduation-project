server.port=0
server.servlet.context-path=/api

spring.datasource.url=jdbc:h2:mem:shoppingmall;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.main.banner-mode=off
spring.main.log-startup-info=false

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:schema-test.sql
spring.sql.init.data-locations=classpath:data-test.sql

spring.data.redis.repositories.enabled=false
spring.cache.type=simple

jwt.secret=test-secret-key-for-automated-checks-only
jwt.expiration=86400000
jwt.refresh-expiration=604800000
jwt.header=Authorization

file.upload-dir=../uploads-test

spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

logging.level.root=WARN
logging.level.com.shopping=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.test.context=WARN
logging.level.org.springframework.test.context.support.AnnotationConfigContextLoaderUtils=WARN
logging.level.org.hibernate.orm.deprecation=ERROR
